[project]
name = "seclearn-eval"
version = "0.1.0"
description = "SecLearn eval set: builds and checks the gold set from a corpus snapshot (ADR 0004)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=0.70",
    "google-genai>=1.30",
    "ir-measures>=0.4.3",
    "numpy>=2.0",
    "pydantic>=2.9,<3",
    "ranx>=0.3.21",
]

[project.scripts]
seclearn-eval = "seclearn_eval.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.17.1",
]
retrieval = [
    "pyvi>=0.1.1",
    "sentence-transformers>=3.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seclearn_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
target-version = "py312"

[tool.ruff.lint]
# Errors, imports, likely bugs (B023: a closure reading a loop variable), modern syntax, ruff's own checks.
select = ["E4", "E7", "E9", "F", "I", "B", "UP", "RUF"]
# Vietnamese text and typographic dashes are intended, not look-alike characters.
ignore = ["RUF001", "RUF002", "RUF003"]
